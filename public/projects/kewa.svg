<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="10 10 140 140" fill="none">
  <!--
    kewa: a take-a-number strip. The queue runs off the left edge, and the
    front ticket has just been torn off: claimed, the way a worker leases a
    row. Rough cream ink, flat warm fill printed a hair out of register, one
    cobalt accent. Drawn by hand, for a dark tile.
  -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <path id="strip" d="M -10 56 H 6 A 4 4 0 0 0 14 56 H 48 A 4 4 0 0 0 56 56 H 94 L 91 62 L 95 68 L 91 74 L 95 80 L 91 86 L 95 92 L 91 98 L 94 104 H 56 A 4 4 0 0 0 48 104 H 14 A 4 4 0 0 0 6 104 H -10 Z" />
    <path id="torn" d="M 100 56 H 136 Q 142 56 142 62 V 98 Q 142 104 136 104 H 100 L 97 98 L 101 92 L 97 86 L 101 80 L 97 74 L 101 68 L 97 62 Z" />
    <path id="d0" d="M 5 0 C 11.7 0 11.7 16 5 16 C -1.7 16 -1.7 0 5 0 Z" />
    <path id="d7" d="M 0 0 H 10 L 4 16" />
    <path id="d8" d="M 5 7.5 C 0 7.5 0 0 5 0 C 10 0 10 7.5 5 7.5 C -0.5 7.5 -0.5 16 5 16 C 10.5 16 10.5 7.5 5 7.5 Z" />
    <path id="d9" d="M 10 5 A 5 5 0 1 1 0 5 A 5 5 0 1 1 10 5 C 10 10 9 14 5 16" />
  </defs>
  <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round" transform="translate(-6 0)">
    <use href="#strip" fill="#44403c" transform="translate(3 3)" />
    <use href="#strip" stroke="#f1ebe0" stroke-width="5" />
    <path d="M 10 64 V 96 M 52 64 V 96" stroke="#f1ebe0" stroke-width="3" stroke-dasharray="0.5 7" />
    <g stroke="#f1ebe0" stroke-width="3.5">
      <use href="#d0" x="19" y="72" />
      <use href="#d9" x="33" y="72" />
      <use href="#d0" x="61" y="72" />
      <use href="#d8" x="75" y="72" />
    </g>
    <g transform="translate(6 -10) rotate(14 120 80)">
      <use href="#torn" fill="#3b82f6" transform="translate(3 3)" />
      <use href="#torn" stroke="#f1ebe0" stroke-width="5" />
      <g stroke="#f1ebe0" stroke-width="3.5">
        <use href="#d0" x="108" y="72" />
        <use href="#d7" x="122" y="72" />
      </g>
    </g>
    <path d="M 128 38 L 131 30 M 142 44 L 149 38" stroke="#f1ebe0" stroke-width="4" />
  </g>
</svg>
