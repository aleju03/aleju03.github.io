<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="10 10 140 140" fill="none">
  <!--
    peeko: somebody peeking over the top of a dashboard card, hands on the
    edge, eyes down on the traffic line. Same kit as the site's doodles: rough
    cream ink, a flat warm fill printed a hair out of register, one cobalt
    accent. Drawn by hand, for a dark tile.
  -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <path id="head" d="M 52 90 A 28 28 0 0 1 108 90 Z" />
    <rect id="card" x="20" y="88" width="120" height="44" rx="8" />
    <path id="hand" d="M 0 4 A 4 4 0 0 1 8 4 V 12 A 4 4 0 0 1 0 12 Z M 8 4 A 4 4 0 0 1 16 4 V 13 A 4 4 0 0 1 8 13 Z M 16 4 A 4 4 0 0 1 24 4 V 12 A 4 4 0 0 1 16 12 Z" />
  </defs>
  <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round" stroke="#f1ebe0">
    <use href="#head" fill="#44403c" stroke="none" transform="translate(3 3)" />
    <use href="#head" stroke-width="5" />
    <path d="M 80 62 C 76 55 80 50 86 51" stroke-width="4" />
    <circle cx="70" cy="77" r="7" fill="#f1ebe0" stroke="none" />
    <circle cx="90" cy="77" r="7" fill="#f1ebe0" stroke="none" />
    <circle cx="71.5" cy="79.5" r="3.4" fill="#18181b" stroke="none" />
    <circle cx="91.5" cy="79.5" r="3.4" fill="#18181b" stroke="none" />
    <use href="#card" fill="#18181b" stroke="none" />
    <use href="#card" fill="#3b82f6" stroke="none" transform="translate(3 3)" />
    <use href="#card" stroke-width="5" />
    <path d="M 32 120 L 50 110 L 64 116 L 84 102 L 100 110 L 124 98" stroke-width="4" />
    <circle cx="124" cy="98" r="4.5" fill="#f1ebe0" stroke="none" />
    <g fill="#44403c" stroke-width="3.5">
      <use href="#hand" x="30" y="82" />
      <use href="#hand" x="106" y="82" />
    </g>
  </g>
</svg>
